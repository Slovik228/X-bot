# fly.toml — twitter-listener (polls X for mentions, no public port needed)
# Build context = project root (so Dockerfile can COPY mini-services/twitter-listener/* + root .env).
# Deploy: fly deploy --app slopius-listener --config fly.listener.toml
app = "slopius-listener"
primary_region = "iad"

[build]
  dockerfile = "mini-services/twitter-listener/Dockerfile"

# No http_service — this is a background worker, not a web server.
# But we DO need it to stay running 24/7 (not auto-stop).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  NEXT_APP_URL = "https://slopius-web.fly.dev"

# Keep the listener running 24/7 — never auto-stop.
# (Without this, Fly may stop a worker that has no HTTP service.)
[processes]
  app = "bun index.ts"

[[services]]
  internal_port = 3004
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
