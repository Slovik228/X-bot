# fly.toml — twitter-listener (polls X for mentions, no public port needed)
# Build context = project root (so Dockerfile can COPY mini-services/twitter-listener/* + root .env).
# Deploy: fly deploy --app slopius-listener --config fly.listener.toml
app = "slopius-listener"
primary_region = "iad"

[build]
  dockerfile = "mini-services/twitter-listener/Dockerfile"

# No [[services]] block — listener is a background worker, not a web server.
# To keep it running 24/7 (not auto-stopped), set auto_stop_machines=false on the VM.

[env]
  NEXT_APP_URL = "https://slopius-web.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  auto_stop_machines = false
