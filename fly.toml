# fly.toml app configuration file generated for x-bot-lympjq on 2026-08-21T20:20:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'x-bot-lympjq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'slopius_db'
  destination = '/app/db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
