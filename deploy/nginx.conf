# nginx config for the single-container deploy.
# Merges Next.js (3000) + bot-relay/socket.io (3003) onto ONE public port (8080).
#
# Routing logic:
#   - socket.io requests (detected by the `EIO` query param that socket.io adds)
#     → bot-relay on 3003 (path /, as configured in mini-services/bot-relay).
#   - everything else → Next.js on 3000.
#   - twitter-listener (3004) is internal-only (not exposed publicly).

worker_processes 2;
events { worker_connections 1024; }

http {
    # Route any request with ?EIO=... (socket.io handshake/polling/websocket)
    # to the bot-relay. Everything else goes to Next.js.
    map $arg_EIO $backend {
        default   http://127.0.0.1:3000;
        "~."      http://127.0.0.1:3003;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 10M;

        location / {
            proxy_pass $backend;
            proxy_http_version 1.1;
            # WebSocket upgrade support (socket.io).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
